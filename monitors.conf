# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto
#
# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
env = GDK_SCALE,1

# Fallback for any unknown/new monitors - auto configure
monitor = , preferred, auto, 1

# Triple monitor setup (left to right): ZEUSLAP (vertical) | Laptop | LG
# Using desc: for consistent identification regardless of which DP port is used
monitor = desc:BOE ZEUSLAP-HDMI 000000001, 1920x1080@60, 0x0, 1, transform, 1  # ZEUSLAP - left (vertical)
monitor = eDP-2, 1920x1080@165, 1080x0, 1                                       # Laptop - center (main)
monitor = desc:LG Electronics LG FULL HD, 1920x1080@60, 3000x0, 1               # LG - right

# Workspace bindings: 1,4,7 → ZEUSLAP | 2,5,8 → Laptop | 3,6,9 → LG
workspace = 1, monitor:desc:BOE ZEUSLAP-HDMI 000000001
workspace = 4, monitor:desc:BOE ZEUSLAP-HDMI 000000001
workspace = 7, monitor:desc:BOE ZEUSLAP-HDMI 000000001

workspace = 2, monitor:eDP-2, default:true
workspace = 5, monitor:eDP-2
workspace = 8, monitor:eDP-2

workspace = 3, monitor:desc:LG Electronics LG FULL HD
workspace = 6, monitor:desc:LG Electronics LG FULL HD
workspace = 9, monitor:desc:LG Electronics LG FULL HD

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2
